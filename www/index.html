<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0914">
<title>TEDEAGA</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="bg"><i></i><i></i><i></i><div id="wp"></div><canvas id="fxc"></canvas></div><svg width="0" height="0" style="position:absolute"><filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence id="wobt" type="fractalNoise" baseFrequency="0.006 0.01" numOctaves="1" seed="3" result="n"/><feDisplacementMap id="wobd" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<div class="wrap" id="app"></div>
<nav class="nav glass" id="nav"></nav>
<input type="file" id="fp" accept="image/*" hidden><input type="file" id="fs" accept="image/*" hidden><input type="file" id="fx" accept=".csv,.tsv,.xlsx,.xls,.txt,.md" hidden><input type="file" id="fw" accept="image/*" hidden><input type="file" id="fa" accept="audio/*" hidden><input type="file" id="fl" accept="audio/*" multiple hidden>
<div id="mas" title="Clique para conversar"><div class="mb"></div></div>
<div id="chat" class="glass" hidden><div class="ch"><b id="chn"></b><span><button class="x" data-a="cclr" title="Limpar">🧹</button><button class="x" data-a="cx">✕</button></span></div><div id="cm"></div><div class="cin"><input id="ci" placeholder="Peça algo: agende, lance, crie…" autocomplete="off"><button class="pri" data-a="csend">➤</button></div></div>
<script src="mobile.js"></script>
<script src="shim.js"></script>
<script src="app.js"></script>
</body>
</html>
